<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1; url=index.html">
    <title>Spectra · Dashboard</title>
    <link rel="icon" type="image/png" href="assets/images/icon-192.png">
    <style>
        :root {
            --bg: #0b0f17;
            --surface: #0f172a;
            --border: #1e293b;
            --accent: #38bdf8;
            --text-1: #f8fafc;
            --text-2: #94a3b8;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text-1);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-redirect-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 580px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .dashboard-img-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: #000;
        }

        .dashboard-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .dashboard-card-body {
            padding: 24px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px;
            font-weight: 700;
            color: var(--text-1);
        }

        p {
            font-size: 0.88rem;
            color: var(--text-2);
            margin: 0 0 18px;
        }

        .btn-direct {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--accent);
            color: #0b0f17;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: opacity 0.15s;
        }

        .btn-direct:hover {
            opacity: 0.9;
        }
    </style>
    <script>
        window.location.replace('index.html');
    </script>
</head>

<body>
    <div class="dashboard-redirect-card">
        <div class="dashboard-img-wrap">
            <img src="assets/images/showcase/dashboard_overview.jpg" alt="Spectra Dashboard Overview Preview">
        </div>
        <div class="dashboard-card-body">
            <h1>Opening Spectra Dashboard…</h1>
            <p>Loading the real-time operations center, telemetry radar, and workspace logs.</p>
            <a href="index.html" class="btn-direct">Enter Dashboard &rarr;</a>
        </div>
    </div>
</body>

</html>
